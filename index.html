<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<title>LUIZA</title>
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #000;
    --ivory: #efe8da;
    --ivory-warm: #f7f0e1;
    --gold: 255, 226, 178;
    --paper: #f6f2ea;
    --ink: #1c1814;
    --ink-soft: rgba(28, 24, 20, 0.8);
    --gold-ink: rgb(172, 134, 70);
    --stage-h: 100vh;
    --stage-h: 100svh;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    max-height: 1000000px;
  }

  html {
    background: var(--black);
    -moz-text-size-adjust: 100%;
    -ms-text-size-adjust: 100%;
    color-scheme: dark;
    -webkit-text-size-adjust: 100%;
    scroll-behavior: auto;
    overscroll-behavior-y: none;
  }

  body {
    background: var(--black);
    color: var(--ivory);
    font-family: "Cormorant Garamond", "Cormorant", "Didot", "Bodoni MT", "Times New Roman", Georgia, serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    overflow-x: hidden;
  }

  /* ---------- Abertura: pista de scroll ---------- */
  .scene {
    position: relative;
    height: calc(var(--stage-h) * 4.2);
  }

  .stage {
    position: sticky;
    top: 0;
    height: var(--stage-h);
    width: 100%;
    overflow: hidden;
    display: grid;
    place-items: center;
    background: var(--black);
    perspective: 900px;
    perspective-origin: 50% 50%;
  }

  /* grão: textura fina sobre o fundo, sempre atrás do texto */
  .stage::before,
  .estage::before,
  .grain {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 0;
    background-image: radial-gradient(at 20% 80%, #fff 1px, transparent 0px);
    background-size: 3px 3px;
    opacity: 0.055;
    mix-blend-mode: plus-lighter;
    pointer-events: none;
    user-select: none;
  }
  /* sobre o branco, o grão é escuro */
  .estage::before,
  .vstage.is-light .grain {
    background-image: radial-gradient(at 20% 80%, #000 1px, transparent 0px);
    mix-blend-mode: multiply;
    opacity: 0.035;
  }

  /* bloom atrás da palavra */
  .bloom {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 140vw;
    height: 140vw;
    max-width: 720px;
    max-height: 720px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(
      circle at center,
      rgba(var(--gold), 0.15) 0%,
      rgba(var(--gold), 0.09) 14%,
      rgba(var(--gold), 0.05) 28%,
      rgba(var(--gold), 0.022) 42%,
      rgba(var(--gold), 0.008) 56%,
      rgba(0,0,0,0) 70%
    );
    opacity: 0;
    pointer-events: none;
    will-change: opacity;
  }

  /* fachos verticais, muito discretos */
  .ray {
    position: absolute;
    left: 50%;
    width: 1px;
    height: calc(var(--stage-h) * 0.22);
    transform: translateX(-50%) scaleY(0);
    opacity: 0;
    pointer-events: none;
    will-change: opacity, transform;
  }
  .ray--up {
    bottom: 50%;
    transform-origin: 50% 100%;
    background: linear-gradient(to top, rgba(var(--gold), 0.55), rgba(var(--gold), 0));
  }
  .ray--down {
    top: 50%;
    transform-origin: 50% 0%;
    background: linear-gradient(to bottom, rgba(var(--gold), 0.45), rgba(var(--gold), 0));
  }

  /* a palavra */
  .word {
    position: relative;
    display: flex;
    align-items: baseline;
    justify-content: center;
    font-weight: 300;
    font-size: 24vw; /* ajustado por JS para nunca cortar */
    line-height: 1;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    white-space: nowrap;
    color: var(--ivory);
    opacity: 0;
    transform-style: preserve-3d;
    transition: opacity 2.4s cubic-bezier(.2,.6,.2,1);
  }
  .word.is-ready { opacity: 1; }

  .letter {
    display: inline-block;
    position: relative;
    transform-origin: 50% 60%;
    will-change: transform, opacity;
    backface-visibility: hidden;
  }
  .letter--hidden { will-change: transform, opacity, filter; }
  .letter:last-child { margin-right: -0.06em; } /* compensa tracking final */

  /* respiração lenta em repouso */
  @keyframes breathe {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.86; }
  }
  .word.is-ready.is-resting { animation: breathe 7s ease-in-out 2.4s infinite; }

  /* pista de gesto: uma palavra e uma linha de um pixel */
  .cue {
    position: absolute;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + var(--stage-h) * 0.17);
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 13px;
    opacity: 0;
    pointer-events: none;
    will-change: opacity;
    transition: opacity 1.6s ease 1.5s;
  }
  .cue-txt {
    font-size: clamp(12px, 3.4vw, 14px);
    font-weight: 400;
    letter-spacing: 0.36em;
    text-indent: 0.36em;
    text-transform: uppercase;
    color: rgba(239, 232, 218, 0.8);
    white-space: nowrap;
  }
  .cue-line {
    position: relative;
    display: block;
    width: 1px;
    height: 46px;
    background: linear-gradient(to bottom, rgba(239,232,218,0) 0%, rgba(239,232,218,0.35) 100%);
  }
  .cue-line::after {
    content: "";
    position: absolute;
    left: 0; top: 0;
    width: 1px; height: 100%;
    background: var(--ivory);
    transform-origin: 50% 0;
    animation: cueSlide 2.8s cubic-bezier(.4,0,.2,1) infinite;
    opacity: 0.95;
  }
  @keyframes cueSlide {
    0% { transform: scaleY(0); transform-origin: 50% 0; }
    45% { transform: scaleY(1); transform-origin: 50% 0; }
    46% { transform-origin: 50% 100%; }
    100% { transform: scaleY(0); transform-origin: 50% 100%; }
  }

  /* ---------- Versículos: assume LUZ e compõe ao redor ---------- */
  .verses {
    position: relative;
    z-index: 2;
    height: calc(var(--stage-h) * 5.6);
    margin-top: calc(var(--stage-h) * -1);
    pointer-events: none;
  }

  .vstage {
    position: sticky;
    top: 0;
    height: var(--stage-h);
    width: 100%;
    overflow: hidden;
    background: transparent;
    visibility: hidden;
  }
  .vstage.is-live {
    background: var(--black);
    visibility: visible;
  }
  .vstage.is-light { background: var(--paper); }

  /* amanhecer: a luz toma a tela */
  .dawn {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 200vmax;
    height: 200vmax;
    margin: -100vmax 0 0 -100vmax;
    border-radius: 50%;
    background: radial-gradient(
      circle at center,
      rgba(246, 242, 234, 1) 0%,
      rgba(246, 242, 234, 1) 28%,
      rgba(250, 240, 220, 0.85) 40%,
      rgba(255, 236, 200, 0.5) 52%,
      rgba(255, 230, 186, 0.18) 63%,
      rgba(255, 226, 178, 0) 74%
    );
    transform: scale(0);
    pointer-events: none;
    will-change: transform, opacity;
  }

  .vbloom {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 140vw;
    height: 140vw;
    max-width: 720px;
    max-height: 720px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(
      circle at center,
      rgba(var(--gold), 0.15) 0%,
      rgba(var(--gold), 0.09) 14%,
      rgba(var(--gold), 0.05) 28%,
      rgba(var(--gold), 0.022) 42%,
      rgba(var(--gold), 0.008) 56%,
      rgba(0,0,0,0) 70%
    );
    opacity: 0.95;
    pointer-events: none;
    will-change: transform, opacity;
  }

  .vray {
    position: absolute;
    left: 50%;
    width: 1px;
    height: calc(var(--stage-h) * 0.22);
    transform: translateX(-50%) scaleY(1);
    pointer-events: none;
    will-change: opacity;
  }
  .vray--up {
    bottom: 50%;
    transform-origin: 50% 100%;
    background: linear-gradient(to top, rgba(var(--gold), 0.55), rgba(var(--gold), 0));
    opacity: 0.42;
  }
  .vray--down {
    top: 50%;
    transform-origin: 50% 0%;
    background: linear-gradient(to bottom, rgba(var(--gold), 0.45), rgba(var(--gold), 0));
    opacity: 0.30;
  }

  /* as três letras herdadas */
  .vl {
    position: absolute;
    left: 0;
    top: 0;
    font-weight: 300;
    line-height: 1;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    transform-origin: 0 0;
    will-change: transform;
    backface-visibility: hidden;
  }

  /* composição editorial: o versículo, abaixo de LUZ */
  .comp {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 6vw;
    text-align: center;
    transform: translateY(-1.5vh);
  }

  .eyebrow {
    position: relative;
    width: 100%;
    height: 1.3em;
    margin-bottom: 2.2vw;
    font-size: clamp(13px, 4vw, 18px);
    font-weight: 600;
    letter-spacing: 0.34em;
    text-indent: 0.34em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .eb {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    opacity: 0;
    will-change: opacity, transform;
  }

  .line {
    display: flex;
    align-items: baseline;
    justify-content: center;
    white-space: nowrap;
  }
  .slot {
    display: inline-block;
    visibility: hidden;
    line-height: 1;
    font-weight: 300;
    letter-spacing: 0.28em;
    margin-right: -0.22em;
    text-transform: uppercase;
  }

  .mundo {
    margin-top: 2.2vw;
    height: 1.3em;
    font-size: clamp(13px, 4vw, 18px);
    font-weight: 600;
    letter-spacing: 0.34em;
    text-indent: 0.34em;
    text-transform: uppercase;
    color: var(--ink-soft);
    opacity: 0;
    will-change: opacity, transform;
  }

  .ref {
    position: relative;
    width: 100%;
    height: 1.6em;
    margin-top: 6vw;
    font-size: clamp(12px, 3.6vw, 15px);
    font-weight: 600;
    letter-spacing: 0.36em;
    text-indent: 0.36em;
    text-transform: uppercase;
    color: var(--gold-ink);
  }
  .rf {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    opacity: 0;
    will-change: opacity, transform;
  }

  .vfade {
    position: absolute;
    inset: 0;
    background: var(--paper);
    opacity: 0;
    pointer-events: none;
    will-change: opacity;
  }

  /* ---------- Encerramento: o resto do versículo ---------- */
  .ending {
    position: relative;
    z-index: 3;
    height: calc(var(--stage-h) * 4.6);
    margin-top: calc(var(--stage-h) * -1);
    pointer-events: none;
  }
  .estage {
    position: sticky;
    top: 0;
    height: var(--stage-h);
    width: 100%;
    overflow: hidden;
    display: grid;
    place-items: center;
    background: transparent;
    visibility: hidden;
  }
  .estage.is-live {
    background: var(--paper);
    visibility: visible;
  }
  .ebloom {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 140vw;
    height: 140vw;
    max-width: 720px;
    max-height: 720px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(
      circle at center,
      rgba(255, 214, 150, 0.22) 0%,
      rgba(255, 214, 150, 0.14) 16%,
      rgba(255, 214, 150, 0.07) 32%,
      rgba(255, 214, 150, 0.025) 48%,
      rgba(255, 214, 150, 0) 68%
    );
    opacity: 0;
    pointer-events: none;
    will-change: opacity, transform;
  }

  .moment {
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3.2vw;
    padding: 0 8vw;
    text-align: center;
  }
  .m-small {
    font-size: clamp(13px, 4vw, 18px);
    font-weight: 600;
    letter-spacing: 0.34em;
    text-indent: 0.34em;
    text-transform: uppercase;
    line-height: 1.5;
    color: var(--ink-soft);
    opacity: 0;
    will-change: opacity, transform;
  }
  .m-big {
    font-size: clamp(38px, 11.5vw, 64px);
    font-weight: 500;
    line-height: 1.05;
    color: var(--ink);
    opacity: 0;
    will-change: opacity, transform;
  }
  .m-luz {
    display: inline-block;
    will-change: color, text-shadow;
  }
  .m-ref {
    margin-top: 3vw;
    font-size: clamp(12px, 3.6vw, 15px);
    font-weight: 600;
    letter-spacing: 0.36em;
    text-indent: 0.36em;
    text-transform: uppercase;
    color: var(--gold-ink);
    opacity: 0;
    will-change: opacity, transform;
  }

  /* ---------- Desfecho: o nome e as redes ---------- */
  .finale {
    position: relative;
    z-index: 4;
    height: calc(var(--stage-h) * 2.6);
    margin-top: calc(var(--stage-h) * -1);
    pointer-events: none;
  }
  .fstage {
    position: sticky;
    top: 0;
    height: var(--stage-h);
    width: 100%;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 6vw calc(env(safe-area-inset-bottom, 0px));
    background: var(--black);
    opacity: 0;
    visibility: hidden;
    will-change: opacity;
  }
  .fstage.is-live {
    visibility: visible;
    pointer-events: auto;
  }
  /* mesmo grão da abertura, agora sobre o preto */
  .fstage::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 0;
    background-image: radial-gradient(at 20% 80%, #fff 1px, transparent 0px);
    background-size: 3px 3px;
    opacity: 0.055;
    mix-blend-mode: plus-lighter;
    pointer-events: none;
  }
  /* o nome como única fonte de luz no escuro */
  .fbloom {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 150vw;
    height: 150vw;
    max-width: 760px;
    max-height: 760px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(
      circle at center,
      rgba(var(--gold), 0.13) 0%,
      rgba(var(--gold), 0.08) 16%,
      rgba(var(--gold), 0.04) 32%,
      rgba(var(--gold), 0.015) 48%,
      rgba(var(--gold), 0) 68%
    );
    opacity: 0;
    pointer-events: none;
    will-change: opacity;
  }
  .fword {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: var(--ivory-warm);
    text-shadow:
      0 0 5px rgba(255, 246, 226, 0.20),
      0 0 24px rgba(255, 232, 190, 0.13),
      0 0 80px rgba(255, 220, 160, 0.10);
    opacity: 0;
    will-change: opacity;
  }
  .fline {
    display: block;
    font-weight: 300;
    font-size: 22vw;
    line-height: 0.96;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .fsocial {
    position: relative;
    display: flex;
    gap: 4vw;
    margin-top: 11vw;
    opacity: 0;
    will-change: opacity;
  }
  .fsocial a {
    display: grid;
    place-items: center;
    width: 48px;
    height: 48px;
    color: rgba(239, 232, 218, 0.72);
    transition: color 0.45s ease, filter 0.45s ease;
  }
  @media (hover: hover) {
    .fsocial a:hover {
      color: rgb(255, 226, 178);
      filter: drop-shadow(0 0 7px rgba(255, 214, 150, 0.3));
    }
  }
  .fsocial a:focus-visible,
  .fsocial a:active {
    color: rgb(255, 226, 178);
    filter: drop-shadow(0 0 7px rgba(255, 214, 150, 0.3));
    outline: none;
  }
  .fsocial svg {
    width: 24px;
    height: 24px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .fsocial svg .solid { fill: currentColor; stroke: none; }

  @media (prefers-reduced-motion: reduce) {
    .word.is-ready.is-resting { animation: none; }
    .cue-line::after { animation: none; transform: scaleY(1); }
    .word { transition-duration: 0.8s; }
  }
</style>
<script>
(function () {
  var root = document.documentElement;
  var lastW = -1, ok = false;

  function lock(force) {
    var w = window.innerWidth, h = window.innerHeight;
    if (!w || !h || h < 200) return false;
    if (!force && ok && w === lastW) return false;
    lastW = w; ok = true;
    window.__H = h;
    root.style.setProperty("--stage-h", h + "px");
    return true;
  }

  function relayout(force) {
    if (lock(force)) window.dispatchEvent(new Event("resize"));
  }

  lock(true);
  window.addEventListener("resize", function () { lock(false); });
  window.addEventListener("orientationchange", function () { setTimeout(function () { relayout(true); }, 300); });
  window.addEventListener("load", function () { relayout(true); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { relayout(true); });
  [300, 900, 2000, 3500].forEach(function (t) { setTimeout(function () { relayout(true); }, t); });

  window.__ticks = window.__ticks || [];
  (function tick() {
    var fns = window.__ticks;
    for (var i = 0; i < fns.length; i++) fns[i]();
    requestAnimationFrame(tick);
  })();
})();
</script>
</head>
<body>

<section class="scene" id="scene">
  <div class="stage" id="stage">
    <div class="bloom" id="bloom"></div>
    <div class="ray ray--up" id="rayUp"></div>
    <div class="ray ray--down" id="rayDown"></div>

    <div class="word is-resting" id="word" aria-label="LUIZA">
      <span class="letter" data-keep>L</span>
      <span class="letter" data-keep>U</span>
      <span class="letter letter--hidden" data-hide data-dir="-1">I</span>
      <span class="letter" data-keep>Z</span>
      <span class="letter letter--hidden" data-hide data-dir="1">A</span>
    </div>

    <div class="cue" id="cue">
      <span class="cue-txt">deslize</span>
      <i class="cue-line"></i>
    </div>
  </div>
</section>

<section class="verses" id="verses">
  <div class="vstage" id="vstage">
    <div class="dawn" id="dawn"></div>
    <div class="grain"></div>
    <div class="vbloom" id="vbloom"></div>
    <div class="vray vray--up" id="vrayUp"></div>
    <div class="vray vray--down" id="vrayDown"></div>

    <div class="comp" id="comp">
      <div class="eyebrow">
        <span class="eb" id="eb">Vocês são a</span>
      </div>
      <div class="line">
        <span class="slot" id="slot">LUZ</span>
      </div>
      <div class="mundo" id="mundo">do mundo.</div>
      <div class="ref">
        <span class="rf" id="rf">Mateus 5:14</span>
      </div>
    </div>

    <span class="vl" aria-hidden="true">L</span>
    <span class="vl" aria-hidden="true">U</span>
    <span class="vl" aria-hidden="true">Z</span>

    <div class="vfade" id="vfade"></div>
  </div>
</section>

<section class="ending" id="ending">
  <div class="estage" id="estage">
    <div class="ebloom" id="ebloom"></div>

    <div class="moment" id="mA">
      <div class="m-small">Não se pode esconder</div>
      <div class="m-big">uma cidade</div>
      <div class="m-small">construída<br>sobre um monte.</div>
    </div>

    <div class="moment" id="mB">
      <div class="m-small" id="b1">Assim brilhe</div>
      <div class="m-big" id="b2">a <span class="m-luz" id="bluz">luz</span> de vocês</div>
      <div class="m-small" id="b3">diante dos homens.</div>
      <div class="m-ref" id="b4">Mateus 5:16</div>
    </div>
  </div>
</section>

<section class="finale" id="finale">
  <div class="fstage" id="fstage">
    <div class="fbloom" id="fbloom"></div>
    <h1 class="fword" id="fword">
      <span class="fline">Luiza</span>
      <span class="fline">Possi</span>
    </h1>
    <nav class="fsocial" id="fsocial" aria-label="Redes sociais"></nav>
  </div>
</section>

<script>
(function () {
  'use strict';

  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var scene   = document.getElementById('scene');
  var word    = document.getElementById('word');
  var bloom   = document.getElementById('bloom');
  var rayUp   = document.getElementById('rayUp');
  var rayDown = document.getElementById('rayDown');
  var cue     = document.getElementById('cue');
  var letters = Array.prototype.slice.call(word.querySelectorAll('.letter'));
  var keep    = letters.filter(function (l) { return l.hasAttribute('data-keep'); });
  var hide    = letters.filter(function (l) { return l.hasAttribute('data-hide'); });

  /* ---------- utilidades ---------- */

      '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.6 11.2c-.3-3-2-4.2-3.9-4.2-2.1 0-3.4 1.1-3.9 2.4"/><path d="M15.6 11.2c1.6.6 2.5 1.7 2.5 3.1 0 2.2-2 3.6-4.3 3.6-2.5 0-4.1-1.3-4.1-3 0-1.6 1.5-2.7 3.9-2.7 1.4 0 2.5.2 3.5.6"/><path d="M15.6 11.2c.1 3.1-1.1 5-3.2 5"/><path d="M19.4 6.9C18 4.5 15.6 3.3 12.4 3.3 7.2 3.3 4.4 6.6 4.4 12s2.8 8.7 8 8.7c3.1 0 5.4-1.1 6.9-3.2"/></svg>'
  };
  var LABELS = { instagram: 'Instagram', youtube: 'YouTube', spotify: 'Spotify', tiktok: 'TikTok', threads: 'Threads' };

  Object.keys(LINKS).forEach(function (k) {
    if (!LINKS[k]) return;
    var a = document.createElement('a');
    a.href = LINKS[k];
    a.target = '_blank';
    a.rel = 'noopener';
    a.setAttribute('aria-label', LABELS[k]);
    a.innerHTML = ICONS[k];
    social.appendChild(a);
  });

  var lines = Array.prototype.slice.call(word.querySelectorAll('.fline'));

  function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  function range(p, a, b) { return clamp01((p - a) / (b - a)); }
  function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

  /* as duas linhas terminam exatamente na mesma largura */
  function fit() {
    var TRIAL = 100, TRACK = 0.06;
    var vw = window.innerWidth;
    var W = Math.min(vw * (vw < 600 ? 0.78 : 0.86), 520);

    lines.forEach(function (el) {
      el.style.fontSize = TRIAL + 'px';
      el.style.letterSpacing = '0px';
      el.style.marginRight = '0px';
    });

    var nat = lines.map(function (el) { return el.getBoundingClientRect().width; });
    var gaps = lines.map(function (el) { return Math.max(1, el.textContent.trim().length - 1); });

    var fs = Infinity;
    nat.forEach(function (w, i) { fs = Math.min(fs, W / (w / TRIAL + gaps[i] * TRACK)); });

    lines.forEach(function (el, i) {
      el.style.fontSize = fs + 'px';
      var s = (W - nat[i] * fs / TRIAL) / gaps[i];
      el.style.letterSpacing = s.toFixed(3) + 'px';
      el.style.marginRight = (-s).toFixed(3) + 'px';
    });
  }

  var target = 0, current = 0, raf = null, lastApplied = -1;

  function readProgress() {
    var r = finale.getBoundingClientRect();
    var travel = r.height - (window.__H || window.innerHeight);
    target = travel > 0 ? clamp01(-r.top / travel) : 0;
    stage.classList.toggle('is-live', r.top <= 0);
  }

  function loop() {
    var k = reduced ? 1 : 0.085;
    current += (target - current) * k;
    if (Math.abs(target - current) < 0.0005) current = target;
    if (current !== lastApplied) { apply(current); lastApplied = current; }
    if (current !== target) raf = requestAnimationFrame(loop);
    else raf = null;
  }

  function schedule() {
    readProgress();
    if (raf === null) raf = requestAnimationFrame(loop);
  }

  function apply(p) {
    // o preto entra por cima do branco, sem corte
    stage.style.opacity = easeOut(range(p, 0.02, 0.30)).toFixed(3);
    word.style.opacity = easeOut(range(p, 0.36, 0.64)).toFixed(3);
    bloom.style.opacity = (0.95 * easeOut(range(p, 0.38, 0.74))).toFixed(3);
    social.style.opacity = easeOut(range(p, 0.56, 0.84)).toFixed(3);
  }

  function init() {
    fit();
    lastApplied = -1;
    readProgress();
    current = target;
    apply(current);
    lastApplied = current;
  }

  var ready = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
  ready.then(init);
  setTimeout(function () { if (!lines[0].style.fontSize) init(); }, 2400);

  window.addEventListener("scroll", schedule, { passive: true });
  (window.__ticks = window.__ticks || []).push(schedule);
  var t = null;
  function onResize() { clearTimeout(t); t = setTimeout(function () { init(); schedule(); }, 140); }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);
})();
</script>
<script>
(function () {
  if (location.search.indexOf('debug') === -1) return;
  var box = document.createElement('div');
  box.setAttribute('style', 'position:fixed;left:6px;top:6px;z-index:99999;background:rgba(0,0,0,.82);color:#0f0;font-family:monospace;font-size:11px;line-height:1.45;padding:7px 9px;border-radius:5px;white-space:pre;pointer-events:none;max-width:92vw');
  document.body.appendChild(box);
  function px(v) { return Math.round(parseFloat(v) || 0); }
  setInterval(function () {
    var w = document.getElementById('word');
    var ab = document.querySelector('.word .letter');
    var vl = document.querySelector('.vl');
    var vls = [].slice.call(document.querySelectorAll('.vl')).map(function (e) { return e.getBoundingClientRect(); });
    var larg = vls.length ? Math.round(Math.max.apply(null, vls.map(function (x) { return x.right; })) - Math.min.apply(null, vls.map(function (x) { return x.left; }))) : 0;
    box.textContent =
      'tela ' + window.innerWidth + ' x ' + window.innerHeight + '  dpr ' + (window.devicePixelRatio || 1) + '\n' +
      'stage-h ' + getComputedStyle(document.documentElement).getPropertyValue('--stage-h').trim() + '  __H ' + window.__H + '\n' +
      'abertura fonte ' + px(w ? w.style.fontSize : 0) + '  letra alt ' + (ab ? Math.round(ab.getBoundingClientRect().height) : 0) + '\n' +
      'LUZ fonte ' + px(vl ? vl.style.fontSize : 0) + '  larg ' + larg + ' (' + Math.round(larg / window.innerWidth * 100) + '%)\n' +
      'scroll ' + Math.round(window.scrollY) + ' / ' + (document.documentElement.scrollHeight - window.innerHeight);
  }, 250);
})();
</script>
